# Testes do backend (Fase 05).
#
# Roda "mvnw verify" (compila e executa todos os testes contra um PostgreSQL
# embutido) a cada push na main e a cada PR que mexa no backend.
# Custo zero: GitHub Actions é gratuito em repositório público.

name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch: {}

# Só leitura: este workflow não publica nada.
permissions:
  contents: read

# Um PR novo cancela a execução anterior do mesmo PR.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Preparar o Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar e testar
        run: sh ./mvnw --batch-mode --no-transfer-progress verify
