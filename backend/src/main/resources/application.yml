# Configuração da API do Painel Financeiro.
#
# Segredos e endereços NUNCA ficam aqui: tudo vem de variáveis de ambiente
# (${NOME:padrão}). Lista completa e exemplos no backend/README.md.

spring:
  application:
    name: painel-financeiro-api
  datasource:
    # Ex.: jdbc:postgresql://host:5432/painel?sslmode=require
    url: ${PAINEL_DB_URL:}
    username: ${PAINEL_DB_USUARIO:}
    password: ${PAINEL_DB_SENHA:}
    hikari:
      # Poucas conexões: bancos gratuitos limitam o total.
      maximum-pool-size: ${PAINEL_DB_POOL:5}
  jpa:
    # Sem consultas ao banco depois que a resposta já foi montada.
    open-in-view: false
    hibernate:
      # O esquema é do Flyway (db/migration); o Hibernate só confere se bate.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  # PORT é a variável que as hospedagens costumam definir. 8081 em dev,
  # porque o front (npm run dev) já usa a 8080.
  port: ${PORT:8081}
  # "framework" quando a API estiver atrás do proxy da hospedagem (IP real do pedido).
  forward-headers-strategy: ${PAINEL_FORWARD_HEADERS:none}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

painel:
  # Preenchido pelo Maven com a versão do pom.xml.
  versao: '@project.version@'
  jwt:
    segredo: ${PAINEL_JWT_SEGREDO:}
    # Token de acesso curto; o app renova sozinho com o token de renovação.
    validade: ${PAINEL_JWT_VALIDADE:15m}
    renovacao: ${PAINEL_JWT_RENOVACAO:30d}
    emissor: painel-financeiro-api
  cors:
    # Separadas por vírgula, sem barra no fim.
    origens: ${PAINEL_CORS_ORIGENS:http://localhost:8080,http://127.0.0.1:8080}
  login:
    max-tentativas: 5
    janela: 15m
  backups:
    # Cada conta guarda os últimos 10; um backup pode ter até 5 MB
    # (o mesmo limite do arquivo de backup no app).
    maximo: 10
    tamanho-maximo: 5MB
  # IA pelo servidor (parte 5.5). Sem PAINEL_GEMINI_CHAVE, fica desligada.
  ia:
    chave: ${PAINEL_GEMINI_CHAVE:}
    url: ${PAINEL_GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models}
    # Os mesmos modelos que o app oferece; o primeiro é o padrão.
    modelos: ${PAINEL_GEMINI_MODELOS:gemini-3.5-flash-lite,gemini-3.8-flash}
    # Pedidos por conta por dia: protege a cota gratuita do Gemini.
    limite-diario: ${PAINEL_IA_LIMITE_DIARIO:50}
    tamanho-maximo: 30000
    tempo-limite: 30s
  usuario-inicial:
    email: ${PAINEL_USUARIO_EMAIL:}
    senha: ${PAINEL_USUARIO_SENHA:}

springdoc:
  api-docs:
    enabled: ${PAINEL_SWAGGER:false}
  swagger-ui:
    enabled: ${PAINEL_SWAGGER:false}

logging:
  level:
    root: INFO
