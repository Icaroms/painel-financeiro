# Perfil "dev": só para rodar no seu computador (spring-boot:test-run).
#
# O banco é um PostgreSQL embutido que guarda os dados em backend/.banco-dev
# (fora do Git). Os valores abaixo são de DESENVOLVIMENTO: nunca use em
# produção. Na hospedagem, tudo vem das variáveis de ambiente.

painel:
  jwt:
    segredo: so-para-desenvolvimento-nunca-use-em-producao-0001
  usuario-inicial:
    email: dev@painel.local
    senha: senha-dev-123456

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.icaroms.painel: DEBUG
    io.zonky: WARN
