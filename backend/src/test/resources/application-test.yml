# Perfil "test": usado pelos testes automáticos (mvnw verify).
# O banco é um PostgreSQL embutido, criado e apagado a cada execução
# (ver TesteIntegracao). Nada aqui é segredo de verdade.

painel:
  jwt:
    segredo: segredo-so-para-testes-com-mais-de-32-caracteres
  usuario-inicial:
    email: teste@painel.local
    senha: senha-de-teste-123

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.flywaydb: WARN
    org.hibernate: WARN
    io.zonky: WARN
